<form action="/destinations/{{destination._id}}/activities/{{#activity}}{{_id}}/edit{{/activity}}{{^activity}}new{{/activity}}" method="post" enctype="multipart/form-data" class="php-email-form" data-aos="fade-up" data-aos-delay="300">
    <div class="row gy-4">
            <!--New activity features-->

            <div class="col-md-6">
              <input type="text" name="activity-title" value="{{activity.title}}" class="form-control" placeholder="Título de la actividad" required>
            </div>        
            <div class="col-md-6">
              <input type="number" name="activity-price" value="{{activity.price}}" class="form-control" placeholder="Precio (€)" required step="0.01" min="0">
            </div>
            <div class="col-md-6">
              <select name="element-category" class="form-select" required>
                <option value="" disabled {{^activity}}selected{{/activity}}>Selecciona la categoría de la actividad</option>
                <option value="adventure" {{#isAdventure}}selected{{/isAdventure}}>AVENTURA</option>
                <option value="culture" {{#isCulture}}selected{{/isCulture}}>CULTURA</option>
                <option value="gastronomy" {{#isGastronomy}}selected{{/isGastronomy}}>GASTRONOMÍA</option>
                <option value="nature" {{#isNature}}selected{{/isNature}}>NATURALEZA</option>
              </select>
            </div>

            <div class="col-md-6">
              <select name="activity-requires-booking" class="form-select" required>
                <option value="" disabled {{^activity}}selected{{/activity}}>¿Requiere reserva previa?</option>
                <option value="yes" {{#activity.requiresBooking}}selected{{/activity.requiresBooking}}>SÍ</option>
                <option value="no" {{#activity}}{{^requiresBooking}}selected{{/requiresBooking}}{{/activity}}>NO</option>
              </select>
            </div>

            <div class="col-md-12">
              <textarea class="form-control" name="activity-description" rows="6" placeholder="Descripción de la actividad" required>{{activity.description}}</textarea>
            </div>

            <div class="col-md-12">
                {{#activity}}
                <p>Imagen actual:</p>
                <img src="{{imageUrl}}" alt="Imagen de {{title}}" style="max-width: 300px;">
                <p>Selecciona otra imagen si quieres cambiarla.</p>
                {{/activity}}

                <input type="file" class="form-control" name="image" accept="image/*" {{^activity}}required{{/activity}}>
            </div>
            
            <!--/New activity features-->

            <div class="col-md-12 text-center">
              <button type="submit" class="btn btn-success">Guardar</button>
            </div>

          </div>
        </form>
