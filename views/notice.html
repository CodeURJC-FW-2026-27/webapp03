<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>{{title}} | SuperTrip</title>
  <link href="/assets/img/logo_new.png" rel="icon">
  <link href="/assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="/assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="/assets/vendor/aos/aos.css" rel="stylesheet">
  <link href="/assets/css/main.css" rel="stylesheet">
</head>

<body class="contact-page">
  {{> site_header}}
  <main class="main">
    <section class="page-title section">
      <div class="heading">
        <div class="container">
          <div class="row justify-content-center text-center">
            <div class="col-lg-8">
              {{#isError}}
              <i class="bi bi-exclamation-triangle text-danger" style="font-size: 4rem;" aria-hidden="true"></i>
              {{/isError}}
              <h1>{{title}}</h1>
              <p class="mb-4">{{message}}</p>
              <a href="{{actionUrl}}" class="btn {{#isError}}btn-success{{/isError}}{{^isError}}btn-dark{{/isError}}">{{actionLabel}}</a>
              {{#detailUrl}}
              <a href="{{detailUrl}}" class="btn btn-success">{{detailLabel}}</a>
              {{/detailUrl}}
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
  {{> site_footer}}
  <script src="/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/vendor/aos/aos.js"></script>
  <script src="/assets/js/main.js"></script>
</body>

</html>
